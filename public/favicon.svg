<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo circular con degradado azul marino profundo -->
    <radialGradient id="fondo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e4e79" />
      <stop offset="65%" stop-color="#102d4a" />
      <stop offset="100%" stop-color="#0b1d30" />
    </radialGradient>

    <!-- Resplandor solar/halo dorado -->
    <radialGradient id="halo" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#eab308" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ca8a04" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Degradado metálico para la Santa Cruz -->
    <linearGradient id="cruz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Filtro de sombra suave -->
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#05101a" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base circular -->
  <circle cx="32" cy="32" r="30" fill="url(#fondo)" stroke="#eab308" stroke-width="2" stroke-opacity="0.7" />

  <!-- Aureola de luz central -->
  <circle cx="32" cy="27" r="18" fill="url(#halo)" />

  <!-- Destellos diagonales -->
  <g stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="32" y1="12" x2="32" y2="16" />
    <line x1="32" y1="38" x2="32" y2="42" />
    <line x1="17" y1="27" x2="21" y2="27" />
    <line x1="43" y1="27" x2="47" y2="27" />
    <line x1="21" y1="16" x2="24" y2="19" />
    <line x1="43" y1="38" x2="40" y2="35" />
    <line x1="43" y1="16" x2="40" y2="19" />
    <line x1="21" y1="38" x2="24" y2="35" />
  </g>

  <!-- Santa Cruz dorada estilizada con sombra -->
  <g filter="url(#sombra)">
    <path
      d="M32 9v36M17 27h30"
      stroke="url(#cruz)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Núcleo de luz central -->
    <circle cx="32" cy="27" r="3.2" fill="#ffffff" />
    <circle cx="32" cy="27" r="2" fill="#fef08a" />
  </g>
</svg>
